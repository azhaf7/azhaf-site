  <body>
    <script>
      // Apply the saved colour theme before first paint (no flash).
      try {
        var theme = localStorage.getItem('azhaf-press-theme')
        var themes = ['olive', 'blush']
        document.documentElement.dataset.theme = themes.indexOf(theme) !== -1 ? theme : 'olive'
        // Browser chrome (status / address bar) matches the opening screen.
        var papers = { olive: '#4a5a27', blush: '#6b1f36' }
        document.querySelector('meta[name="theme-color"]').content =
          papers[document.documentElement.dataset.theme]
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
